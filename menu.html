<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <script
      src="https://kit.fontawesome.com/e39b3f788c.js"
      crossorigin="anonymous"
    ></script>
</head>
<body>

    <header class="navbar">

        <!-- Logo -->
        <div class="logo">

            <div class="logo-circle">
                <img src="images/kichen-removebg-preview.png" alt="Kicthen">
            </div>

            <div class="logo-text">
                <h2>Kitchen</h2>
                <span>AFRICAN FOOD & GRILL</span>
            </div>

        </div>


        <!-- Navigation -->
        <nav>
            <a href="#">Home</a>
            <a href="menu.html">Menu</a>
            <a href="#">Services</a>
            <a href="#">Events</a>
            <a href="#">Reservations</a>
            <a href="#">About</a>
            <a href="#">Locations</a>
        </nav>


        <!-- Right side -->
        <div class="nav-right">

            <a href="menu" class="order-button">
                Order Now
            </a>

            <button class="cart-button">
                <img src="images/shopping-bag.svg" alt="shoping">
            </button>

        </div>
    </header>
        
<!-- ORDER ONLINE SECTION -->
<section class="order-section">

    <!-- Background Hero -->
    <div class="order-hero">

        <div class="order-overlay"></div>

        <div class="order-content">

            <span class="order-label">
                <img src="/images/order.webp" alt="order">
                OUR MENU
            </span>

            <h1>Order online</h1>

            <p>
                Fresh Nigerian & West-African cooking, ready for pickup or delivery.
                Add your favourites to the cart and check out in minutes.
            </p>

        </div>

    </div>


    <!-- Search and Categories -->
    <div class="menu-navigation">

        <!-- Search -->
        <div class="search-box">

            <i class="fa-solid fa-magnifying-glass"></i>

            <input 
                type="text" 
                placeholder="Search dishes..."
            >

        </div>


        <!-- Categories -->
        <div class="categories">

            <button class="category active">All</button>

            <button class="category">Rices</button>

            <button class="category">Beans</button>

            <button class="category">Swallows</button>

            <button class="category">Soup</button>

            <button class="category">Proteins</button>

            <button class="category">Pepper Soup</button>

            <button class="category">Bites</button>

            <button class="category">Main Dishes</button>

            <button class="category">Fries</button>

            <button class="category">Salad</button>

            <button class="category">Sides</button>

        </div>

    </div>

</section>
    
    </body>
    </html>
